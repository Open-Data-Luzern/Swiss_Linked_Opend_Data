[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swiss-ogd"
version = "1.0"
description = "Je Oberorganisation auf opendata.swiss eine SQLite-Datenbank mit Katalog und Daten"
requires-python = ">=3.12"

# Dev-Bedingung "Limit Libraries": der Kern laeuft auf der Standardbibliothek.
# Die beiden Zusaetze sind optional — fehlen sie, entsteht ein
# Qualitaetsbefund statt eines Absturzes.
dependencies = []

[project.optional-dependencies]
formate = [
    "openpyxl>=3.1",   # XLSX-Arbeitsmappen
    "pyarrow>=16",     # Parquet
    # Verlaesslicher Wurzelspeicher. Windows installiert Wurzeln bei Bedarf;
    # ohne certifi haengt es vom Zustand des Rechners ab, ob ein Host geprueft
    # werden kann — siehe netz._ssl_kontext.
    "certifi",
]
entwicklung = ["pytest>=8"]

[project.scripts]
swiss-ogd = "swiss_ogd.aufbau:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
swiss_ogd = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
